# Egress allowlist for the office. Anything not listed is refused and logged.
# Watch denials while you use the office:  docker compose logs -f egress | grep DENIED
http_port 3128
acl allowed dstdomain "/etc/squid/allowed-domains.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all
logformat compact %ts %>a %Ss/%>Hs %rm %ru
access_log stdio:/dev/stdout compact
cache deny all
