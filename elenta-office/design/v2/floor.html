<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;overflow:hidden;background:#EEF0F3;font-family:'IBM Plex Sans',sans-serif}
.lab{position:absolute;transform:translate(0,-100%);white-space:nowrap;pointer-events:none}
.lab.room{display:flex;flex-direction:column;gap:2px;padding:6px 10px;background:#fff;border-radius:8px;box-shadow:0 4px 14px rgba(15,23,42,.12)}
.lab.room b{font:600 12px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#0F172A;display:flex;align-items:center;gap:7px}
.lab.room b:before{content:'';width:8px;height:8px;border-radius:2px;background:var(--a)}
.lab.room span{font-size:11px;color:#64748B}
.lab.pod{font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#0F172A;background:rgba(255,255,255,.92);padding:4px 7px;border-radius:5px;display:flex;gap:6px;align-items:center;box-shadow:0 2px 6px rgba(15,23,42,.08)}
.lab.pod i{width:6px;height:6px;border-radius:50%;background:var(--a)} .lab.pod em{font-style:normal;color:#64748B}
.lab.lead{color:#92400E}
</style></head><body><script src="floor.bundle.js"></script></body></html>
