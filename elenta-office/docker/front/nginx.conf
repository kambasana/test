# Publishes the office on the host's loopback. Passes the Host header through so the office's own
# Host check still applies, and does not buffer Server-Sent Events.
worker_processes 1;
pid /run/nginx.pid;
events { worker_connections 256; }
http {
  server_tokens off;
  client_max_body_size 1m;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server {
    listen 4180;
    location / {
      proxy_pass http://office:4180;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 1h;
    }
  }
}
